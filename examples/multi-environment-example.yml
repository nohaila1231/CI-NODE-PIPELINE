name: Multi-Environment Deployment Example

# This example demonstrates deployment to dev, staging, and production
# with approval gates and environment-specific configurations

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Deploy to dev automatically on every merge to main
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    uses: your-org/node-ci-template/.github/workflows/node-template.yml@main
    with:
      enable-deployment: 'true'
      target-environment: 'dev'
      deployment-command: 'npm run deploy:dev'
      enable-notifications: 'true'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

---

# Manual deployment to staging with approval
name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        type: string

jobs:
  staging-deployment:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Deploy to staging
        run: |
          npm run deploy:staging
          echo "✓ Deployed ${{ github.event.inputs.version }} to staging"
        env:
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Run smoke tests
        run: npm run test:e2e:staging
        continue-on-error: true

---

# Production deployment with strict approval gates
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to deploy'
        required: true
        type: string
      rollback:
        description: 'Rollback to previous version?'
        required: false
        type: boolean
        default: false

jobs:
  production-deployment:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.example.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ github.event.inputs.version }}

      - name: Verify version
        run: |
          echo "Deploying version: ${{ github.event.inputs.version }}"
          git tag -l | grep "v${{ github.event.inputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build:prod

      - name: Run final tests
        run: npm run test:prod

      - name: Create pre-deployment backup
        run: npm run backup:prod
        continue-on-error: true

      - name: Deploy to production
        run: |
          npm run deploy:prod
          echo "✓ Production deployment complete"
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Run health checks
        run: npm run health:prod

      - name: Verify deployment
        run: |
          curl -f https://api.example.com/health || exit 1
          echo "✓ Production health check passed"

      - name: Notify deployment
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "✅ Production deployment successful",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Version", "value": "${{ github.event.inputs.version }}", "short": true},
                  {"title": "Environment", "value": "production", "short": true},
                  {"title": "Deployed by", "value": "${{ github.actor }}", "short": true}
                ]
              }]
            }'

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ Production deployment failed",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Version", "value": "${{ github.event.inputs.version }}", "short": true},
                  {"title": "Action", "value": "Review logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false}
                ]
              }]
            }'

---

# Full pipeline: Test → Stage → Approval → Prod
name: Full Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  # Tests on release tag
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Auto-deploy to staging
  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run build
      - run: npm run deploy:staging
        env:
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}

  # Manual approval before production
  approval:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Wait for approval
        run: echo "Waiting for production approval..."

  # Deploy to production (after approval)
  deploy-production:
    needs: approval
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run build:prod
      - run: npm run deploy:prod
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

---

# How environments work:

# 1. GitHub Environment Setup:
#    - Settings > Environments
#    - Create: dev, staging, prod
#    - Each has own secrets and protection rules

# 2. Protection Rules (per environment):
#    Dev:     None (auto-deploy)
#    Staging: Optional reviewers
#    Prod:    Required reviewers (2+), timeout

# 3. Environment Secrets:
#    Available only in that environment
#    Cannot be used in other environments
#    Example: PROD_API_KEY only in prod

# 4. Deployment Status:
#    Visible in Deployments tab
#    Shows all deployments to each env
#    Can rollback to previous deployment

---

# Environment variable usage in scripts:

# scripts/deploy.js
process.env.ENVIRONMENT // From target-environment input
process.env.PROD_API_KEY // From production environment secrets
process.env.DEPLOYMENT_TARGET // From GitHub environment URL

---

# Rollback pattern:

name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to'
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.example.com
    steps:
      - name: Checkout previous version
        uses: actions/checkout@v4
        with:
          ref: v${{ github.event.inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Deploy previous version
        run: npm run deploy:prod
        env:
          PROD_API_KEY: ${{ secrets.PROD_API_KEY }}

      - name: Verify rollback
        run: npm run health:prod

      - name: Notify rollback
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"🔄 Production rolled back to v${{ github.event.inputs.version }}"}'
