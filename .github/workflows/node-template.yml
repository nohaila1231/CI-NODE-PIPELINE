name: Node.js CI/CD Template

on:
  workflow_call:
    inputs:
      # Core configuration
      node-versions:
        description: 'JSON array of Node.js versions to test (e.g., ["18.x", "20.x", "22.x"])'
        required: false
        default: '["20.x"]'
        type: string

      working-directory:
        description: 'Working directory for all commands'
        required: false
        default: '.'
        type: string

      package-manager:
        description: 'Package manager to use (npm, yarn, pnpm, bun)'
        required: false
        default: 'npm'
        type: string

      # Build configuration
      install-command:
        description: 'Custom install command (overrides default based on package manager)'
        required: false
        default: ''
        type: string

      build-command:
        description: 'Build command to run'
        required: false
        default: 'npm run build'
        type: string

      # Testing configuration
      test-command:
        description: 'Test command to run'
        required: false
        default: 'npm test'
        type: string

      enable-coverage:
        description: 'Enable code coverage reporting'
        required: false
        default: 'false'
        type: string

      coverage-command:
        description: 'Custom coverage command'
        required: false
        default: 'npm run coverage'
        type: string

      coverage-threshold:
        description: 'Minimum coverage percentage required (0-100)'
        required: false
        default: '80'
        type: string

      # Linting & quality
      enable-linting:
        description: 'Enable linting checks'
        required: false
        default: 'true'
        type: string

      lint-command:
        description: 'Lint command to run'
        required: false
        default: 'npm run lint'
        type: string

      enable-type-checking:
        description: 'Enable TypeScript type checking'
        required: false
        default: 'false'
        type: string

      type-check-command:
        description: 'Type check command to run'
        required: false
        default: 'npm run type-check'
        type: string

      # Caching
      enable-cache:
        description: 'Enable dependency caching'
        required: false
        default: 'true'
        type: string

      cache-key-prefix:
        description: 'Prefix for cache keys'
        required: false
        default: 'node-deps'
        type: string

      # Artifacts
      enable-artifacts:
        description: 'Upload build artifacts'
        required: false
        default: 'false'
        type: string

      artifact-path:
        description: 'Path to artifacts directory'
        required: false
        default: 'dist'
        type: string

      artifact-retention-days:
        description: 'Number of days to retain artifacts'
        required: false
        default: '5'
        type: string

      # Pre/Post scripts
      pre-install-script:
        description: 'Script to run before install'
        required: false
        default: ''
        type: string

      post-install-script:
        description: 'Script to run after install'
        required: false
        default: ''
        type: string

      pre-build-script:
        description: 'Script to run before build'
        required: false
        default: ''
        type: string

      post-build-script:
        description: 'Script to run after build'
        required: false
        default: ''
        type: string

      # Behavior controls
      fail-on-warnings:
        description: 'Treat linting warnings as errors'
        required: false
        default: 'false'
        type: string

      continue-on-error:
        description: 'Continue workflow even if tests fail'
        required: false
        default: 'false'
        type: string

      # Publishing
      publish-to-npm:
        description: 'Publish to npm registry after successful test'
        required: false
        default: 'false'
        type: string

      npm-registry:
        description: 'NPM registry URL'
        required: false
        default: 'https://registry.npmjs.org/'
        type: string

      # Release Management (Phase 1)
      enable-release:
        description: 'Enable automated release management with semantic versioning'
        required: false
        default: 'false'
        type: string

      release-branch:
        description: 'Branch to trigger releases from (typically main or master)'
        required: false
        default: 'main'
        type: string

      git-user-name:
        description: 'Git user name for release commits'
        required: false
        default: 'GitHub Actions'
        type: string

      git-user-email:
        description: 'Git user email for release commits'
        required: false
        default: 'actions@github.com'
        type: string

      # Security Scanning (Phase 3)
      enable-security-scan:
        description: 'Enable security scanning (npm audit, CodeQL)'
        required: false
        default: 'false'
        type: string

      security-fail-on-error:
        description: 'Fail workflow on security vulnerabilities'
        required: false
        default: 'false'
        type: string

      # Multi-Environment Support (Phase :  4)
      enable-deployment:
        description: 'Enable deployment jobs'
        required: false
        default: 'false'
        type: string

      target-environment:
        description: 'Target deployment environment (dev, staging, prod)'
        required: false
        default: 'dev'
        type: string

      deployment-command:
        description: 'Command to run for deployment'
        required: false
        default: ''
        type: string

      # Concurrency Control (Phase 6)
      enable-concurrency:
        description: 'Enable concurrency control (cancel in-progress runs)'
        required: false
        default: 'true'
        type: string

      # Notifications (Phase 8)
      enable-notifications:
        description: 'Enable workflow notifications'
        required: false
        default: 'false'
        type: string

      notify-on-success:
        description: 'Send notification on success'
        required: false
        default: 'false'
        type: string

      notify-on-failure:
        description: 'Send notification on failure'
        required: false
        default: 'true'
        type: string

      slack-webhook-url:
        description: 'Slack webhook URL for notifications'
        required: false
        default: ''
        type: string

    secrets:
      npm-token:
        description: 'NPM authentication token for private packages'
        required: false

      npm-registry-token:
        description: 'Token for publishing to npm'
        required: false

      git-token:
        description: 'GitHub token for creating releases and tags'
        required: false
        
permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CI: true

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Validate node versions JSON
        run: |
          echo "Node versions: ${{ inputs.node-versions }}"
          echo '${{ inputs.node-versions }}' | jq '.' > /dev/null || {
            echo "❌ Invalid node-versions JSON: ${{ inputs.node-versions }}"
            exit 1
          }

      - name: Validate package manager
        run: |
          case "${{ inputs.package-manager }}" in
            npm|yarn|pnpm|bun) echo "✓ Valid package manager: ${{ inputs.package-manager }}" ;;
            *) echo "❌ Invalid package manager: ${{ inputs.package-manager }}" && exit 1 ;;
          esac

      - name: Validate coverage threshold
        run: |
          THRESHOLD="${{ inputs.coverage-threshold }}"
          if ! [[ "$THRESHOLD" =~ ^[0-9]+$ ]] || [ "$THRESHOLD" -lt 0 ] || [ "$THRESHOLD" -gt 100 ]; then
            echo "❌ Coverage threshold must be 0-100, got: $THRESHOLD"
            exit 1
          fi
          echo "✓ Coverage threshold valid: $THRESHOLD%"

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: ${{ inputs.continue-on-error == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(inputs.node-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run pre-install script
        if: inputs.pre-install-script != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre-install-script }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: ${{ inputs.npm-registry }}

      - name: Setup package manager
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              npm install -g pnpm
              echo "Package manager: pnpm $(pnpm --version)"
              ;;
            bun)
              npm install -g bun
              echo "Package manager: bun $(bun --version)"
              ;;
            yarn)
              npm install -g yarn
              echo "Package manager: yarn $(yarn --version)"
              ;;
            npm)
              echo "Package manager: npm $(npm --version)"
              ;;
          esac

      - name: Configure cache
        if: inputs.enable-cache == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ inputs.package-manager == 'bun' && '' || inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Generate bun cache key
        if: inputs.enable-cache == 'true' && inputs.package-manager == 'bun'
        id: bun-cache
        run: |
          CACHE_KEY="${{ inputs.cache-key-prefix }}-bun-${{ hashFiles(format('{0}/bun.lockb', inputs.working-directory)) }}"
          echo "key=$CACHE_KEY" >> $GITHUB_OUTPUT

      - name: Restore bun cache
        if: inputs.enable-cache == 'true' && inputs.package-manager == 'bun'
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.key }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-bun-

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.install-command }}" ]; then
            echo "Running custom install command..."
            ${{ inputs.install-command }}
          else
            case "${{ inputs.package-manager }}" in
              pnpm) pnpm install --frozen-lockfile ;;
              yarn) yarn install --frozen-lockfile ;;
              bun) bun install --frozen-lockfile ;;
              npm) npm ci ;;
            esac
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

      - name: Run post-install script
        if: inputs.post-install-script != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.post-install-script }}

      - name: Run pre-build script
        if: inputs.pre-build-script != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.pre-build-script }}

      - name: Run linting
        if: inputs.enable-linting == 'true'
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: ${{ inputs.fail-on-warnings != 'true' }}
        run: ${{ inputs.lint-command }}

      - name: Run type checking
        if: inputs.enable-type-checking == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.type-check-command }}

      - name: Build project
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Run post-build script
        if: inputs.post-build-script != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.post-build-script }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: ${{ inputs.continue-on-error == 'true' }}
        run: ${{ inputs.test-command }}

      - name: Generate coverage report
        if: inputs.enable-coverage == 'true'
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: true
        run: ${{ inputs.coverage-command }}

      - name: Upload coverage to Codecov
        if: inputs.enable-coverage == 'true'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: node-${{ matrix.node-version }}
          fail_ci_if_error: false
     
      - name: build
        run: npm run build

      - name: Upload artifacts
        if: inputs.enable-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node-version }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          retention-days: ${{ inputs.artifact-retention-days }}

  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: test
    if: inputs.publish-to-npm == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: ${{ inputs.npm-registry }}

      - name: Setup package manager
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              npm install -g pnpm
              ;;
            bun)
              npm install -g bun
              ;;
            yarn)
              npm install -g yarn
              ;;
          esac

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.install-command }}" ]; then
            ${{ inputs.install-command }}
          else
            case "${{ inputs.package-manager }}" in
              pnpm) pnpm install --frozen-lockfile ;;
              yarn) yarn install --frozen-lockfile ;;
              bun) bun install --frozen-lockfile ;;
              npm) npm ci ;;
            esac
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}

      - name: Build project
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Publish to npm
        working-directory: ${{ inputs.working-directory }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-registry-token }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: inputs.enable-security-scan == 'true'
    continue-on-error: ${{ inputs.security-fail-on-error == 'false' }}
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run npm audit
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate || true
        continue-on-error: ${{ inputs.security-fail-on-error == 'false' }}

      - name: Setup Node.js for CodeQL
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript'
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: true
          category: "/language:javascript"
          token: ${{ secrets.GITHUB_TOKEN  }}

  # ============================================================
  # SECTION RELEASE CORRIGÉE - LE SEUL CHANGEMENT EST ICI
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: test
    if: |
      inputs.enable-release == 'true' &&
      github.ref == format('refs/heads/{0}', inputs.release-branch) &&
      github.event_name == 'push'
    outputs:
      version: ${{ steps.semver.outputs.next-version }}
      should-release: ${{ steps.semver.outputs.should-release }}
      git-tag: ${{ steps.semver.outputs.git-tag }}
    steps:
      # 1. Cloner le projet utilisateur
      - name: Checkout user project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: user-project

      # 2. Cloner le template (vos scripts)
      - name: Checkout template repo
        uses: actions/checkout@v4
        with:
          repository: nohaila1231/CI-NODE-PIPELINE
          path: template

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 4. Copier les scripts dans le projet
      - name: Copy scripts to project
        run: |
          mkdir -p user-project/scripts
          cp -r template/scripts/* user-project/scripts/
          ls -la user-project/scripts/

      # 5. Calculer la version (script du template sur le projet)
      - name: Calculate semantic version
        id: semver
        working-directory: ./user-project
        run: |
          node scripts/semantic-version.cjs

      # 6. Configurer Git
      - name: Configure Git
        working-directory: ./user-project
        run: |
          git config user.name "${{ inputs.git-user-name }}"
          git config user.email "${{ inputs.git-user-email }}"

      # 7. Générer le changelog
      - name: Generate changelog
        if: steps.semver.outputs.should-release == 'true'
        working-directory: ./user-project
        run: |
          node scripts/changelog-generator.cjs "${{ steps.semver.outputs.next-version }}"

      # 8. Créer le tag Git
      - name: Create Git tag
        if: steps.semver.outputs.should-release == 'true'
        working-directory: ./user-project
        run: |
          git tag "${{ steps.semver.outputs.git-tag }}"
          git push https://x-access-token:${{ secrets.git-token }}@github.com/nohaila1231/nodes_project.git "${{ steps.semver.outputs.git-tag }}"
          
        env:
          GITHUB_TOKEN: ${{ secrets.git-token || secrets.GITHUB_TOKEN }}

      # 9. Commit du changelog
      - name: Commit changelog
        if: steps.semver.outputs.should-release == 'true'
        working-directory: ./user-project
        run: |
          git add CHANGELOG.md || true
          git commit -m "chore: release ${{ steps.semver.outputs.next-version }}" || true
          git push https://x-access-token:${{ secrets.git-token }}@github.com/nohaila1231/nodes_project.git "${{ inputs.release-branch }}"
        env:
          GITHUB_TOKEN: ${{ secrets.git-token || secrets.GITHUB_TOKEN }}

      # 10. Créer la release GitHub
      - name: Create GitHub Release
        if: steps.semver.outputs.should-release == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.git-token || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.semver.outputs.git-tag }}
          release_name: Release ${{ steps.semver.outputs.next-version }}
          draft: false
          prerelease: false

      - name: Output release information
        if: steps.semver.outputs.should-release == 'true'
        run: |
          echo "✓ Release created:"
          echo "  Version: ${{ steps.semver.outputs.next-version }}"
          echo "  Tag: ${{ steps.semver.outputs.git-tag }}"

  deploy:
    name: Deploy to ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: test
    if: inputs.enable-deployment == 'true'
    strategy:
      matrix:
        environment: ['dev', 'staging', 'prod']
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup package manager
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              npm install -g pnpm
              ;;
            bun)
              npm install -g bun
              ;;
            yarn)
              npm install -g yarn
              ;;
          esac

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.install-command }}" ]; then
            ${{ inputs.install-command }}
          else
            case "${{ inputs.package-manager }}" in
              pnpm) pnpm install --frozen-lockfile ;;
              yarn) yarn install --frozen-lockfile ;;
              bun) bun install --frozen-lockfile ;;
              npm) npm ci ;;
            esac
          fi

      - name: Build project
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Deploy to environment
        if: inputs.deployment-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.deployment-command }}

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test, security, release, deploy]
    if: always() && inputs.enable-notifications == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Determine workflow status
        id: status
        run: |
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.security.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Send failure notification
        if: steps.status.outputs.status == 'failure' && inputs.notify-on-failure == 'true'
        run: |
          echo "Workflow failed"
        continue-on-error: true

      - name: Send success notification
        if: steps.status.outputs.status == 'success' && inputs.notify-on-success == 'true'
        run: |
          echo "Workflow succeeded"
        continue-on-error: true